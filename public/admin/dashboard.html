<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Radiant Aura Photography</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f4f2;
        color: #222;
      }

      .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        background: white;
        border-bottom: 1px solid #e5e5e5;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .dashboard-header h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      .logout-btn {
        border: none;
        background: black;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        cursor: pointer;
      }

      .dashboard-main {
        max-width: 1100px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .card {
        background: white;
        border-radius: 18px;
        padding: 1.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        margin-bottom: 1.5rem;
      }

      h2 {
        margin-top: 0;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      .form-row {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr auto;
        align-items: end;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input[type="text"],
      input[type="file"],
      select {
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        border: 1px solid #d8d8d8;
        background: #fff;
      }

      .primary-btn {
        border: none;
        background: black;
        color: white;
        padding: 0.95rem 1.2rem;
        border-radius: 12px;
        cursor: pointer;
      }

      .primary-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status-message {
        margin-top: 1rem;
        font-size: 0.95rem;
        color: #444;
        white-space: pre-line;
      }

      .gallery-list {
        display: grid;
        gap: 1rem;
      }

      .gallery-card {
        border: 1px solid #ececec;
        border-radius: 16px;
        padding: 1rem;
        background: #fcfcfc;
      }

      .gallery-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .gallery-actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .danger-btn {
        border: none;
        background: #b42318;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        cursor: pointer;
      }

      .danger-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .gallery-images {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.75rem;
      }

      .image-card {
        border: 1px solid #eee;
        border-radius: 12px;
        overflow: hidden;
        background: white;
      }

      .image-card img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        display: block;
        background: #f3f3f3;
      }

      .image-card-footer {
        padding: 0.5rem;
      }

      .delete-btn {
        width: 100%;
        border: none;
        background: #f2f2f2;
        padding: 0.6rem;
        border-radius: 8px;
        cursor: pointer;
      }

      .helper-text {
        margin-top: 0.5rem;
        font-size: 0.9rem;
        color: #666;
      }

      .upload-progress-box {
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        background: #fafafa;
        display: none;
      }

      .upload-progress-bar {
        width: 100%;
        height: 12px;
        border-radius: 999px;
        background: #e8e8e8;
        overflow: hidden;
        margin-top: 0.65rem;
      }

      .upload-progress-fill {
        height: 100%;
        width: 0%;
        background: black;
        transition: width 0.25s ease;
      }

      @media (max-width: 700px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="dashboard-header">
      <h1>Radiant Aura Admin</h1>
      <button id="logoutBtn" class="logout-btn">Log Out</button>
    </header>

    <main class="dashboard-main">
      <section class="card">
        <h2>Create Client Gallery</h2>
        <div class="form-row">
          <div>
            <label for="clientName">Client Name</label>
            <input
              id="clientName"
              type="text"
              placeholder="e.g. Sarah and James"
            />
          </div>
          <button id="createGalleryBtn" class="primary-btn">
            Create Gallery
          </button>
        </div>
        <p id="createStatus" class="status-message"></p>
      </section>

      <section class="card">
        <h2>Upload Images</h2>

        <div style="margin-bottom: 1rem">
          <label for="gallerySelect">Select Gallery</label>
          <select id="gallerySelect">
            <option value="">Choose a gallery</option>
          </select>
        </div>

        <div style="margin-bottom: 1rem">
          <label for="imageInput">Choose Images</label>
          <input
            id="imageInput"
            type="file"
            multiple
            accept="image/jpeg,image/png,image/webp"
          />
          <p class="helper-text">
            Large uploads are sent in smaller batches automatically.
          </p>
        </div>

        <button id="uploadBtn" class="primary-btn">Upload Images</button>
        <p id="uploadStatus" class="status-message"></p>

        <div id="uploadProgressBox" class="upload-progress-box">
          <div id="uploadProgressText">Preparing upload...</div>
          <div class="upload-progress-bar">
            <div id="uploadProgressFill" class="upload-progress-fill"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Existing Galleries</h2>
        <div id="galleryList" class="gallery-list">
          <p>Loading galleries...</p>
        </div>
      </section>
    </main>

    <script>
      const logoutBtn = document.getElementById("logoutBtn");
      const clientNameInput = document.getElementById("clientName");
      const createGalleryBtn = document.getElementById("createGalleryBtn");
      const createStatus = document.getElementById("createStatus");

      const gallerySelect = document.getElementById("gallerySelect");
      const imageInput = document.getElementById("imageInput");
      const uploadBtn = document.getElementById("uploadBtn");
      const uploadStatus = document.getElementById("uploadStatus");

      const uploadProgressBox = document.getElementById("uploadProgressBox");
      const uploadProgressText = document.getElementById("uploadProgressText");
      const uploadProgressFill = document.getElementById("uploadProgressFill");

      const galleryList = document.getElementById("galleryList");

      const UPLOAD_BATCH_SIZE = 1;

      logoutBtn.addEventListener("click", async () => {
        try {
          const response = await fetch("/admin/logout", {
            method: "POST",
            credentials: "include",
          });

          const result = await readJsonResponse(response);

          if (result.success) {
            window.location.href = "/admin/login";
          } else {
            alert(result.message || "Logout failed.");
          }
        } catch (error) {
          console.error("Logout error:", error);
          alert("Something went wrong during logout.");
        }
      });

      async function readJsonResponse(response) {
        const text = await response.text();
        console.log("Raw response:", text);

        let result;
        try {
          result = JSON.parse(text);
        } catch (error) {
          throw new Error(
            `Server returned non-JSON response (${response.status}): ${text.slice(0, 300)}`,
          );
        }

        if (!response.ok) {
          throw new Error(
            result.message || `Request failed with status ${response.status}`,
          );
        }

        return result;
      }

      function showUploadProgress() {
        uploadProgressBox.style.display = "block";
      }

      function hideUploadProgress() {
        uploadProgressBox.style.display = "none";
        uploadProgressText.textContent = "Preparing upload...";
        uploadProgressFill.style.width = "0%";
      }

      function setUploadProgress(current, total, batchNumber, totalBatches) {
        const percent = total > 0 ? Math.round((current / total) * 100) : 0;
        uploadProgressText.textContent =
          `Uploading image ${current} of ${total} ` +
          `(batch ${batchNumber} of ${totalBatches})`;
        uploadProgressFill.style.width = `${percent}%`;
      }

      async function loadGalleries() {
        galleryList.innerHTML = "<p>Loading galleries...</p>";
        gallerySelect.innerHTML = '<option value="">Choose a gallery</option>';

        try {
          const response = await fetch("/api/admin/galleries", {
            credentials: "include",
          });

          const result = await readJsonResponse(response);

          if (!result.success) {
            galleryList.innerHTML = "<p>Failed to load galleries.</p>";
            return;
          }

          if (result.galleries.length === 0) {
            galleryList.innerHTML = "<p>No galleries yet.</p>";
            return;
          }

          galleryList.innerHTML = "";

          result.galleries.forEach((gallery) => {
            const option = document.createElement("option");
            option.value = gallery.name;
            option.textContent = `${gallery.name} (${gallery.imageCount})`;
            gallerySelect.appendChild(option);

            const card = document.createElement("div");
            card.className = "gallery-card";

            const folderId = `folder-${gallery.name}`;

            card.innerHTML = `
    <div class="gallery-head">
      <div>
        <strong>📁 ${escapeHtml(gallery.name)}</strong>
        <p style="margin: 0.35rem 0 0 0; color: #666;">
          ${gallery.imageCount} image(s)
        </p>
      </div>

      <div class="gallery-actions">
        <button
          class="primary-btn"
          onclick="toggleFolder('${escapeJsString(folderId)}')"
        >
          Open
        </button>

        <button
          class="danger-btn"
          onclick="deleteGallery('${escapeJsString(gallery.name)}')"
        >
          Delete
        </button>
      </div>
    </div>

    <div id="${folderId}" class="gallery-images" style="display:none;"></div>
  `;

            galleryList.appendChild(card);
          });
        } catch (error) {
          console.error("Load galleries error:", error);
          galleryList.innerHTML =
            "<p>Something went wrong loading galleries.</p>";
        }
      }

      createGalleryBtn.addEventListener("click", async () => {
        const clientName = clientNameInput.value.trim();

        if (!clientName) {
          createStatus.textContent = "Please enter a client name.";
          return;
        }

        createGalleryBtn.disabled = true;
        createStatus.textContent = "Creating gallery...";

        try {
          const response = await fetch("/api/admin/galleries", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({ clientName }),
          });

          const result = await readJsonResponse(response);
          createStatus.textContent = result.message;

          if (result.success) {
            clientNameInput.value = "";
            await loadGalleries();
          }
        } catch (error) {
          console.error("Create gallery error:", error);
          createStatus.textContent =
            error.message || "Something went wrong creating the gallery.";
        } finally {
          createGalleryBtn.disabled = false;
        }
      });

      uploadBtn.addEventListener("click", async () => {
        const clientName = gallerySelect.value;
        const files = Array.from(imageInput.files);

        if (!clientName) {
          uploadStatus.textContent = "Please select a gallery.";
          return;
        }

        if (!files.length) {
          uploadStatus.textContent = "Please choose at least one image.";
          return;
        }

        uploadBtn.disabled = true;
        uploadStatus.textContent = `Preparing ${files.length} image(s) for upload...`;
        showUploadProgress();

        try {
          const totalBatches = Math.ceil(files.length / UPLOAD_BATCH_SIZE);

          for (let i = 0; i < files.length; i += UPLOAD_BATCH_SIZE) {
            const batchNumber = Math.floor(i / UPLOAD_BATCH_SIZE) + 1;
            const batchFiles = files.slice(i, i + UPLOAD_BATCH_SIZE);

            const formData = new FormData();
            formData.append("clientName", clientName);

            for (const file of batchFiles) {
              formData.append("images", file);
            }

            setUploadProgress(
              Math.min(i + batchFiles.length, files.length),
              files.length,
              batchNumber,
              totalBatches,
            );

            const response = await fetch("/api/admin/upload", {
              method: "POST",
              credentials: "include",
              body: formData,
            });

            const result = await readJsonResponse(response);

            if (!result.success) {
              throw new Error(result.message || `Batch ${batchNumber} failed.`);
            }
          }

          uploadProgressFill.style.width = "100%";
          uploadProgressText.textContent = `Upload finished. ${files.length} of ${files.length} image(s) uploaded.`;
          uploadStatus.textContent = `Upload complete. ${files.length} image(s) uploaded successfully.`;

          imageInput.value = "";
          await loadGalleries();

          setTimeout(() => {
            hideUploadProgress();
          }, 900);
        } catch (error) {
          console.error("Upload error:", error);
          uploadStatus.textContent =
            error.message || "Something went wrong during upload.";
          hideUploadProgress();
        } finally {
          uploadBtn.disabled = false;
        }
      });

      async function deleteImage(clientName, filename) {
        const confirmed = confirm(
          `Delete image "${filename}" from "${clientName}"?`,
        );
        if (!confirmed) return;

        try {
          const response = await fetch("/api/admin/images", {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({ clientName, filename }),
          });

          const result = await readJsonResponse(response);

          if (result.success) {
            await loadGalleries();
          } else {
            alert(result.message || "Delete failed");
          }
        } catch (error) {
          console.error("Delete image error:", error);
          alert(error.message || "Something went wrong deleting the image.");
        }
      }

      async function deleteGallery(clientName) {
        const confirmed = confirm(
          `Delete the whole gallery "${clientName}"?\n\nThis will remove all images in that folder.`,
        );
        if (!confirmed) return;

        try {
          const response = await fetch("/api/admin/galleries", {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({ clientName }),
          });

          const result = await readJsonResponse(response);

          if (result.success) {
            uploadStatus.textContent = "";
            createStatus.textContent = result.message || "Gallery deleted.";
            await loadGalleries();
          } else {
            alert(result.message || "Failed to delete gallery.");
          }
        } catch (error) {
          console.error("Delete gallery error:", error);
          alert(error.message || "Something went wrong deleting the gallery.");
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function escapeJsString(value) {
        return String(value)
          .replaceAll("\\", "\\\\")
          .replaceAll("'", "\\'")
          .replaceAll('"', '\\"');
      }

      async function toggleFolder(folderId) {
        const container = document.getElementById(folderId);
        if (!container) return;

        const button = container
          .closest(".gallery-card")
          .querySelector(".primary-btn");

        const isOpen = container.style.display === "flex";

        if (isOpen) {
          container.style.display = "none";
          button.textContent = "Open";
          return;
        }

        button.textContent = "Close";

        // Already loaded, just open it
        if (container.dataset.loaded === "true") {
          container.style.display = "grid";
          return;
        }

        container.innerHTML = "<p>Loading images...</p>";
        container.style.display = "block";

        try {
          const response = await fetch("/api/admin/galleries", {
            credentials: "include",
          });

          const result = await readJsonResponse(response);

          const galleryName = folderId.replace("folder-", "");
          const gallery = result.galleries.find((g) => g.name === galleryName);

          if (!gallery) {
            container.innerHTML = "<p>Gallery not found.</p>";
            return;
          }

          if (gallery.images.length === 0) {
            container.innerHTML = "<p>No images found.</p>";
            container.dataset.loaded = "true";
            return;
          }

          container.innerHTML = gallery.images
            .map(
              (image) => `
          <div class="image-card">
            <img src="${image.url}" alt="${escapeHtml(image.filename)}">
            <div class="image-card-footer">
              <button
                class="delete-btn"
                onclick="deleteImage('${escapeJsString(gallery.name)}', '${escapeJsString(image.filename)}')"
              >
                Delete Image
              </button>
            </div>
          </div>
        `,
            )
            .join("");

          container.dataset.loaded = "true";
          container.style.display = "grid";
        } catch (error) {
          console.error("Load folder error:", error);
          container.innerHTML = "<p>Failed to load images.</p>";
        }
      }

      loadGalleries();
      window.deleteImage = deleteImage;
      window.deleteGallery = deleteGallery;
      window.toggleFolder = toggleFolder;
    </script>
  </body>
</html>
